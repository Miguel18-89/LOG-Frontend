server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # O nginx nao traz este tipo na lista por omissao; sem ele o manifesto era
  # servido como texto e o browser recusava-o.
  types {
    application/manifest+json  webmanifest;
  }

  location / {
    try_files $uri /index.html;
  }

  # index.html referencia sempre os ficheiros com hash mais recentes — nunca pode ficar em cache
  # no browser, senão um deploy novo só aparece depois de um hard refresh (em vez de um refresh
  # normal, ou de todo, dependendo da heurística de cache do browser).
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
  }

  # Allow direct access to static files
  location /images/ {
    try_files $uri =404;
  }

  # Optional for assets under /assets or /static
  location /assets/ {
    try_files $uri =404;
  }

  # Optional cache control
  location ~* \.(?:jpg|jpeg|gif|png|ico|css|js|svg|woff2?)$ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public";
  }
}
